server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers (hardened defaults for self-scan A/A+)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-XSS-Protection "0" always;

  # SPA routing fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # SSE live scan stream (buffering disabled, extended timeout)
  location = /api/scan/stream {
    proxy_pass              http://api:4000/api/scan/stream;
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Connection "";
    proxy_buffering         off;
    proxy_cache             off;
    chunked_transfer_encoding on;
    proxy_connect_timeout   10s;
    proxy_read_timeout      600s;
  }

  # General API reverse proxy
  location /api/ {
    proxy_pass              http://api:4000/api/;
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_connect_timeout   10s;
    proxy_read_timeout      180s;
  }

  # Static health endpoint
  location = /healthz {
    return 200 '{"ok":true}';
    add_header Content-Type application/json;
  }
}
