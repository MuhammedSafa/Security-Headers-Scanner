version: "3.9"

services:
  api:
    build:
      context: ./secscan-api
      dockerfile: Dockerfile
    container_name: secscan-api
    environment:
      - NODE_ENV=production
      # İstersen concurrency ayarlarını env’den al:
      # - SCAN_CONCURRENCY=15
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ui:
    build:
      context: ./secscan-ui
      dockerfile: Dockerfile
    container_name: secscan-ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

